<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>商品类目智能推荐</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>商品类目智能推荐</h1>
<!--      <p class="sub">输入商品标题，点击“推荐类目”，即可调用你的 <code>/predict</code> 接口。</p>-->

      <div class="row">
        <label class="label">商品名称：</label>
        <input id="title" class="input" placeholder="例如：唯美小清新连衣裙 / 240ml*15元充2430个大袋装 ..." />
        <button id="btnPredict" class="btn primary">推荐类目</button>
      </div>

      <div class="chips" id="chips"></div>

      <div class="result">
        <div class="result-title">商品类目：</div>
        <div class="breadcrumb" id="breadcrumb">—</div>
        <div class="hint" id="hint">提示：你也可以点上面的推荐关键词快速补全标题。</div>
      </div>

      <div class="actions">
        <button id="btnConfirm" class="btn">确认选择</button>
        <button id="btnClear" class="btn ghost">清空</button>
      </div>

      <div class="log" id="log"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
